# Rulare zilnică din cloud, GRATUIT, chiar și cu calculatorul local oprit (R-902).
#
# IMPORTANT — citiți înainte de a activa acest workflow:
# Cât timp aplicația rulează doar LOCAL (baza de date SQLite trăiește pe
# discul acestui calculator, secțiunea 16 / R-1601), GitHub Actions NU are
# cum să ajungă la acea bază de date — acest workflow e pregătit, dar
# inactiv practic, până la mutarea pe server (R-1602: STORAGE_BACKEND=firestore
# + un loc unde acest cod rulează permanent, accesibil din cloud). Din acel
# moment, activați workflow-ul fără nicio altă schimbare de cod.
#
# R-903 — ora de vară/iarnă: cron-ul lucrează STRICT în UTC, deci pornim de
# DOUĂ ori pe zi (acoperind ambele offset-uri posibile ale României); scriptul
# scripts/verifica_ora_si_ruleaza.py verifică explicit ora locală și rulează
# efectiv calculul o singură dată, la ora corectă — fără intervenție manuală.
- name: Creare fisier credentiale Google Cloud
        run: echo "${{ secrets.GCP_SA_KEY }}" > gcp_key.json

      - name: Rulează prognoza (dacă e ora corectă a României)
        env:
          STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND || 'firestore' }}
          FIRESTORE_PROJECT_ID: ${{ secrets.FIRESTORE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: gcp_key.json
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_NAME: ${{ vars.SMTP_FROM_NAME }}
        run: python scripts/verifica_ora_si_ruleaza.py
name: Rulare zilnică prognoză

on:
  schedule:
    - cron: '0 5 * * *'   # acoperă cazul cu ora de vară a României (UTC+3 -> 08:00 local)
    - cron: '0 6 * * *'   # acoperă cazul cu ora de iarnă a României (UTC+2 -> 08:00 local)
  workflow_dispatch: {}   # R-904 — declanșator manual suplimentar, la cerere

jobs:
  ruleaza-portofoliul:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalează dependențele
        run: pip install -r requirements.txt

      - name: Rulează prognoza (dacă e ora corectă a României)
        env:
          STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND || 'firestore' }}
          FIRESTORE_PROJECT_ID: ${{ secrets.FIRESTORE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_PATH }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_NAME: ${{ vars.SMTP_FROM_NAME }}
        run: python scripts/verifica_ora_si_ruleaza.py
